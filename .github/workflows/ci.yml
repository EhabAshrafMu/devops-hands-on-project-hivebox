name: CI/CD Pipeline for HiveBox Project

on:
    push:
        branches: [ "main", "development", "phase-4-kubernetes" ]
    pull_request:
        branches: [ "main", "development" ]

env:
    PYTHON_VERSION: '3.11'
    IMAGE_NAME: ehabashrafmu/hivebox
    IMAGE_TAG: 0.0.2

jobs:
    # Stage 1: Test the application
    test:
        name: Test Application
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: ${{ env.PYTHON_VERSION }}

        - name: Install dependencies
          run: |
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pylint pytest pytest-asyncio pytest-cov

        - name: Lint with pylint
          run: |
            echo "Running pylint analysis..."
            python3 -m pylint src/main.py

        - name: Start application for testing
          run: |
            echo "Starting FastAPI application..."
            python3 src/main.py &
            APP_PID=$!
            echo "APP_PID=$APP_PID" >> $GITHUB_ENV
            sleep 10  # Wait for app to fully start

        - name: Run unit tests
          run: |
            echo "Running unit tests with coverage..."
            python3 -m pytest tests/test_*.py -v --cov=src --cov-report=xml

        - name: Run integration tests
          run: |
            echo "Running integration tests..."
            PYTHONPATH=. python3 -m pytest tests/test_integration_simple.py -v

        - name: Test API endpoints
          run: |
            echo "Testing API endpoints..."
            
            # Test version endpoint
            echo "Testing /version endpoint..."
            version_response=$(curl -s http://localhost:8000/version)
            echo "Version response: $version_response"
            if echo "$version_response" | grep -q "0.0.2"; then
                echo "Version endpoint test passed"
            else
                echo "Version endpoint test failed"
                exit 1
            fi
            
            # Test health endpoint
            echo "Testing /health endpoint..."
            health_response=$(curl -s http://localhost:8000/health)
            echo "Health response: $health_response"
            if echo "$health_response" | grep -q "healthy"; then
                echo "Health endpoint test passed"
            else
                echo "Health endpoint test failed"
                exit 1
            fi
            
            # Test readiness endpoint
            echo "Testing /readyz endpoint..."
            readyz_response=$(curl -s http://localhost:8000/readyz)
            echo "Readiness response: $readyz_response"
            if echo "$readyz_response" | grep -q "ready"; then
                echo "Readiness endpoint test passed"
            else
                echo "Readiness endpoint test failed"
                exit 1
            fi
            

        - name: Cleanup application
          if: always()
          run: |
            if [ ! -z "$APP_PID" ]; then
                echo "Stopping application..."
                kill $APP_PID || true
            fi

        - name: Upload coverage reports
          uses: actions/upload-artifact@v4
          with:
            name: coverage-reports
            path: coverage.xml

    # Stage 2: SonarCloud Analysis
    sonarqube-analysis:
        name: SonarCloud Code Quality Analysis
        runs-on: ubuntu-latest
        needs: test

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0  

        - name: Download coverage reports
          uses: actions/download-artifact@v4
          with:
            name: coverage-reports

        - name: SonarCloud Scan
          uses: SonarSource/sonarcloud-github-action@master
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          with:
            args: >
              -Dsonar.projectKey=ehabashrafmu_devops-hands-on-project-hivebox
              -Dsonar.organization=ehabashrafmu
              -Dsonar.host.url=https://sonarcloud.io
              -Dsonar.python.coverage.reportPaths=coverage.xml
              -Dsonar.sources=src
              -Dsonar.tests=tests
              -Dsonar.language=py
              -Dsonar.sourceEncoding=UTF-8

    # Stage 3: Kubernetes Security Scanning
    terrascan-analysis:
        name: Terrascan Kubernetes Security Analysis
        runs-on: ubuntu-latest
        needs: test

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Run Terrascan for Kubernetes
          id: terrascan
          uses: tenable/terrascan-action@main
          with:
            iac_type: 'k8s'
            iac_version: 'v1'
            policy_type: 'k8s'
            only_warn: true
            iac_dir: './k8s_manifests'
            verbose: true

        - name: Upload Terrascan SARIF results
          uses: github/codeql-action/upload-sarif@v2
          if: always()
          with:
            sarif_file: terrascan-results.sarif
    

    # Stage 5: Build and Push (only after all quality gates pass)
    build:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: [test, sonarqube-analysis, terrascan-analysis]
        
        outputs:
            image-tag: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Build Docker image
          run: |
            echo "Building Docker image..."
            docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
            docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest

        - name: Test Docker container
          run: |
            echo "Testing Docker container..."
            
            # Start container in detached mode
            docker run -d --name test-container -p 8001:8000 ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            
            # Wait for container to start
            sleep 15
            
            # Test FastAPI endpoints
            echo "Testing containerized FastAPI endpoints..."
            
            # Test root endpoint
            root_response=$(curl -s http://localhost:8001/ || echo "FAILED")
            echo "Root response: $root_response"
            if echo "$root_response" | grep -q "Welcome"; then
                echo "Root endpoint test passed"
            else
                echo "Root endpoint test failed"
                docker logs test-container
                exit 1
            fi
            
            # Test version endpoint
            version_response=$(curl -s http://localhost:8001/version || echo "FAILED")
            echo "Version response: $version_response"
            if echo "$version_response" | grep -q "0.0.2"; then
                echo "Version endpoint test passed"
            else
                echo "Version endpoint test failed"
                docker logs test-container
                exit 1
            fi
            
            # Test readiness endpoint
            readyz_response=$(curl -s http://localhost:8001/readyz || echo "FAILED")
            echo "Readiness response: $readyz_response"
            if echo "$readyz_response" | grep -q "ready"; then
                echo "Readiness endpoint test passed"
            else
                echo "Readiness endpoint test failed"
                docker logs test-container
                exit 1
            fi
            
            echo "All container tests passed"
            
            # Cleanup
            docker stop test-container
            docker rm test-container

        - name: Container Security Scan with Trivy
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            format: 'sarif'
            output: 'trivy-results.sarif'

        - name: Upload Container Security Results
          uses: github/codeql-action/upload-sarif@v2
          if: always()
          with:
            sarif_file: 'trivy-results.sarif'

        - name: Push Docker image to Docker Hub
          env:
            DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
            DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          run: |
            echo "Pushing to Docker Hub..."
            echo $DOCKER_HUB_ACCESS_TOKEN | docker login -u $DOCKER_HUB_USERNAME --password-stdin
            docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker push ${{ env.IMAGE_NAME }}:latest
            echo "Successfully pushed to Docker Hub"

    # Stage 6: Pipeline Summary
    pipeline-summary:
        name: Pipeline Summary
        runs-on: ubuntu-latest
        needs: [test, sonarqube-analysis, terrascan-analysis, build]
        if: always()

        steps:
        - name: Generate Pipeline Summary
          run: |
            echo "## HiveBox CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Stage Results:" >> $GITHUB_STEP_SUMMARY
            echo "- **Tests:** ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- **SonarCloud Analysis:** ${{ needs.sonarqube-analysis.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Terrascan Security:** ${{ needs.terrascan-analysis.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Semgrep Security:** ${{ needs.semgrep-security.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Build and Push:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Deployment Information:" >> $GITHUB_STEP_SUMMARY
            echo "**Docker Image:** \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Registry:** Docker Hub" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Update Kubernetes manifests with new image tag" >> $GITHUB_STEP_SUMMARY
            echo "2. Deploy to cluster: \`kubectl apply -f k8s_manifests/\`" >> $GITHUB_STEP_SUMMARY
            echo "3. Verify deployment: \`kubectl get pods -l app=hivebox-api\`" >> $GITHUB_STEP_SUMMARY

        - name: Check Pipeline Status
          run: |
            if [[ "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
                echo "Critical pipeline stages failed"
                exit 1
            else
                echo "Pipeline completed successfully"
            fi