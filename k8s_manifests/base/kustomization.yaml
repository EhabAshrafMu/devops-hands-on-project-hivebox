apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: default

# Resources to deploy
resources:
- valkey-deployment.yaml
- valkey-service.yaml
- minio-deployment.yaml
- minio-service.yaml


# Common labels for all resources
labels:
- includeSelectors: true
  pairs:
    project: hivebox
    tier: infrastructure
