apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivebox-api
  labels:
    app: hivebox-api
    component: backend
    version: v0.0.1
  annotations:
    container.apparomor.security.beta.kubernetes.io/hibebox-api: runtime/default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Allow 1 extra pod during updates
      maxUnavailable: 0 # Keep all pods running during updates

  selector:
    matchLabels:
      app: hivebox-api

  template:
    metadata:
      labels:
        app: hivebox-api
        component: backend
        version: v0.0.2
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: hivebox-api
          image: ehabashrafmu/hivebox:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "kubernetes"
            - name: LOG_LEVEL
              value: "INFO"
            - name: SENSEBOX_IDS
              value: "5eba5fbad46fb8001b799786,5c21ff8f919bf8001adf2488,5ade1acf223bd80019a1011c"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          # Health checks for Kubernetes to monitor the application
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
